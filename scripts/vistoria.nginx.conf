# Painel na raiz, aplicativo em /campo e API em /api.
# O certificado entra depois, com o certbot.

server {
    listen 80;
    server_name vistoria.dimensionalengenharia.com;

    root /home/deployer/vistoria/sites;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering off;
        client_max_body_size 25m;
    }

    location /campo/ {
        try_files $uri $uri/ /campo/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
